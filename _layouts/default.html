<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>

    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="keywords" content="{% if page.keywords %}{{ page.keywords | join: ',' }}{% else %}{{ site.keywords }}{% endif %}">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" >

    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:image" content="{{ site.url }}{% if page.image %}{{ page.image }}{% else %}{{ site.default_image }}{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="twitter:image" content="{{ site.url }}{% if page.image %}{{ page.image }}{% else %}{{ site.default_image }}{% endif %}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300&display=swap" rel="stylesheet">


    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon_io/apple-touch-icon.png' | relative_url }}">

    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon_io/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon_io/favicon-16x16.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/images/favicon_io/android-chrome-192x192.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/images/favicon_io/android-chrome-512x512.png' | relative_url }}">

    <link rel="shortcut icon" href="{{ '/assets/images/favicon_io/favicon.ico' | relative_url }}">

    <link rel="manifest" href="{{ '/assets/images/favicon_io/site.webmanifest' | relative_url }}">

    <meta name="theme-color" content="#BB6D2EAD">

    </head>
    <body>
        <header>
            <h1><a href="{{ '/' | relative_url }}">Jacob Berger</a></h1>
            <div class="header-right">
                <nav>
                    <ul>
                        <li><a href="{{ '/' | relative_url }}">Home</a></li>
                        <li><a href="{{ '/resume' | relative_url }}">Resume</a></li>
                        <li><a href="{{ '/projects' | relative_url }}">Projects</a></li>
                        <li><a href="{{ '/calendar' | relative_url }}">Calendar</a></li>
                        <li><a href="{{ '/contact' | relative_url }}">Contact</a></li>
                    </ul>
                </nav>
                <div class="clock-container">
                    <a href="https://github.com/bergerjacob/clocks-clock" target="_blank" rel="noopener noreferrer" class="clock-link">
                        <iframe
                            id="clock-widget"
                            src="https://bergerjacob.github.io/clocks-clock/?height=60&faceColor1=6c757d&faceColor2=343a40&handColor=f8f9fa&inactiveAlpha=60&transparentBg=true&digitSpacing=0&mode=5x3"
                            class="clock-iframe"
                            title="Monochrome Clock Widget">
                        </iframe>
                    </a>
                    <div class="switch-container">
                        <input type="checkbox" id="mode-switch" class="mode-switch-checkbox">
                        <label for="mode-switch" class="mode-switch-label"></label>
                    </div>
                </div>
            </div>
        </header>
        <div class="container">
            {{ content }}
        </div>
        <footer>
            <p>© {{ site.time | date: '%Y' }} {{ site.title }}. All Rights Reserved.</p>
        </footer>
        <script src="{{ '/switch.js' | relative_url }}"></script>
    </body>
</html>
