<link rel="stylesheet" href="{{ '/projects/style.css' | relative_url }}">
<style>
    #controls { display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin-bottom: 20px; }
    #controls div { display: flex; justify-content: space-between; align-items: center; }
    input[type=number] { width: 150px; }
</style>

<div id="controls">
    <div>
        <label for="seedInput">Minecraft Seed:</label>
        <input type="number" id="seedInput" placeholder="Enter Minecraft seed">
    </div>
    <div>
        <label for="startRadiusInput">Start Radius (Chunks):</label>
        <input type="number" id="startRadiusInput" value="20">
    </div>
    <div>
        <label for="endRadiusInput">End Radius (Chunks):</label>
        <input type="number" id="endRadiusInput" value="1000">
    </div>
</div>

<button id="findChunks">Find Slime Chunks</button>
<div id="output" style="white-space: pre-wrap; margin-top: 20px; border: 1px solid #ccc; padding: 10px; min-height: 100px;"></div>

<script>
    const seedInput = document.getElementById('seedInput');
    const startRadiusInput = document.getElementById('startRadiusInput');
    const endRadiusInput = document.getElementById('endRadiusInput');
    const findChunksButton = document.getElementById('findChunks');
    const outputDiv = document.getElementById('output');

    findChunksButton.addEventListener('click', () => {
        const seed = seedInput.value;
        const startRadius = startRadiusInput.value;
        const endRadius = endRadiusInput.value;

        if (!seed) {
            outputDiv.textContent = 'Please enter a seed.';
            return;
        }
        outputDiv.textContent = 'Searching for slime chunks...\n';

        const apiUrl = 'https://slime-chunk-finder-832728061487.us-central1.run.app';

        fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                seed: seed,
                startRadius: startRadius,
                endRadius: endRadius
            })
        })
        .then(response => {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            // If response is not ok, read the error message from the body
            if (!response.ok) {
                return reader.read().then(({value}) => {
                    throw new Error(`Server error (${response.status}): ${decoder.decode(value)}`);
                });
            }
            
            function processStream({ done, value }) {
                if (done) { return; }
                outputDiv.textContent += decoder.decode(value);
                return reader.read().then(processStream);
            }
            return reader.read().then(processStream);
        })
        .catch(error => {
            console.error('Error fetching slime chunk data:', error);
            outputDiv.textContent = error.message;
        });
    });
</script>
