<link rel="stylesheet" href="{{ '/projects/style.css' | relative_url }}">
<style>
    #controls { display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin-bottom: 20px; }
    #controls div { display: flex; justify-content: space-between; align-items: center; }
    input[type=number] { width: 150px; }
</style>

<div id="controls">
    <div>
        <label for="seedInput">Minecraft Seed:</label>
        <input type="number" id="seedInput" placeholder="Enter Minecraft seed">
    </div>
    <div>
        <label for="startRadiusInput">Start Radius (Chunks):</label>
        <input type="number" id="startRadiusInput" value="0">
    </div>
    <div>
        <label for="endRadiusInput">End Radius (Chunks):</label>
        <input type="number" id="endRadiusInput" value="100">
    </div>
</div>

<button id="findChunks">Find Optimal Slime Chunk</button>
<div id="output" style="white-space: pre-wrap; margin-top: 20px; border: 1px solid #ccc; padding: 10px; min-height: 100px;"></div>

<script>
    const seedInput = document.getElementById('seedInput');
    const startRadiusInput = document.getElementById('startRadiusInput');
    const endRadiusInput = document.getElementById('endRadiusInput');
    const findChunksButton = document.getElementById('findChunks');
    const outputDiv = document.getElementById('output');

    findChunksButton.addEventListener('click', async () => {
        const seed = seedInput.value;
        const startRadius = parseInt(startRadiusInput.value, 10);
        const endRadius = parseInt(endRadiusInput.value, 10);

        if (!seed) {
            outputDiv.textContent = 'Please enter a seed.';
            return;
        }
        outputDiv.textContent = 'Searching for the optimal chunk... This might take a moment.';
        findChunksButton.disabled = true;

        // --- UPDATED API URL AND ENDPOINT ---
        const apiUrl = 'https://slime-area-finder.onrender.com/find-optimal-chunk';
        
        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    seed: parseInt(seed, 10),
                    startRadius: startRadius,
                    endRadius: endRadius
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(`Server error (${response.status}): ${errorData.error}`);
            }
            
            // --- UPDATED RESPONSE HANDLING ---
            const result = await response.json();

            if (result.optimalChunk && result.slimeChunksInRange > 0) {
                let outputText = `Search Complete!\n\n`;
                outputText += `The best chunk to stand in is at X: ${result.optimalChunk.x}, Z: ${result.optimalChunk.z}\n`;
                outputText += `From this spot, you are in range of ${result.slimeChunksInRange} slime chunks.`;
                outputDiv.textContent = outputText;
            } else {
                outputDiv.textContent = `Search Complete! No slime chunks found within the specified radius.`;
            }

        } catch (error) {
            console.error('Error fetching data:', error);
            outputDiv.textContent = "An error occurred: " + error.message;
        } finally {
            findChunksButton.disabled = false;
        }
    });
</script>
