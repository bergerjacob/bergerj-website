---
layout: page
title: Apps
---

<p>A collection of simple web tools and projects.</p>

<style>
    .app-list {
        list-style-type: none;
        padding-left: 0;
    }
    .app-list li a {
        display: block;
        padding: 15px;
        margin-bottom: 10px;
        background-color: #2a2a2e;
        border-left: 5px solid var(--favorite-purple, #6D2EAD);
        transition: background-color 0.2s ease-in-out;
        font-size: 1.2em;
        font-weight: bold;
    }
    .app-list li a:hover {
        background-color: #333;
        text-decoration: none;
    }
</style>

<ul class="app-list">
  {% for p in site.pages %}
    {% if p.path contains 'apps/' and p.name == 'index.html' and p.path != 'apps/index.html' %}
      <li>
        <a href="{{ p.url | relative_url }}">{{ p.title | default: "Untitled App" }}</a>
      </li>
    {% endif %}
  {% endfor %}
</ul>
