name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set up Ruby environment
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Install dependencies (Jekyll)
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      # Build the site with Jekyll using bundle exec
      - name: Build Jekyll site
        run: bundle exec jekyll build

      # Pin Node to a version unaffected by the keep-alive regression
      # (nodejs/node#63989) that causes false-negative Firebase deploys.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      # Deploy to Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BERGERJ_WEBSERVER }}
          channelId: live
          projectId: bergerj-webserver